name: Daily lunch menu

on:
  # 매 평일 10:39 KST에 cron-job.org가 이 이벤트로 트리거합니다.
  workflow_dispatch:

jobs:
  send-lunch:
    runs-on: ubuntu-latest
    # 점심 사진(배식 직전 업로드)을 최대 25분 기다리므로 넉넉히 잡습니다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send today's menu
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          MATTERMOST_CHANNEL_ID: 9ac0b84f5d7b6f81293023d1245cd537
          MATTERMOST_URL: https://meeting.ssafy.com
          # 브라우저에서 받은 accessToken이 있으면 웰스토리 원본을 폴백보다 먼저 씁니다.
          # (ID/PW 로그인은 Incapsula WAF에 막혀 안 되므로 Secret을 두지 않습니다.)
          WELLSTORY_ACCESS_TOKEN: ${{ secrets.WELLSTORY_ACCESS_TOKEN }}
          WELLSTORY_DEVICE_ID: ${{ secrets.WELLSTORY_DEVICE_ID }}
          WELLSTORY_REMEMBER_ME: ${{ secrets.WELLSTORY_REMEMBER_ME }}
          WELLSTORY_CAMPUS: 전기부산
          WELLSTORY_RESTAURANT_CODE: REST000595
          MEALCLOUD_URL: https://welstory-meal.cloud
          MEALCLOUD_ENABLED: "true"
          # 실제 점심 사진이 올라올 때까지 기다릴 최대 시간.
          PHOTO_WAIT_MINUTES: "25"
          TIMEZONE: Asia/Seoul
        run: python -m lunchbot
