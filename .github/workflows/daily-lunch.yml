name: Daily lunch menu

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1-5"

jobs:
  send-lunch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install-deps chromium
          python -m playwright install chromium

      - name: Send today's menu
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          MATTERMOST_CHANNEL_ID: 9ac0b84f5d7b6f81293023d1245cd537
          MATTERMOST_URL: https://meeting.ssafy.com
          WELLSTORY_USERNAME: ${{ secrets.WELLSTORY_USERNAME }}
          WELLSTORY_PASSWORD: ${{ secrets.WELLSTORY_PASSWORD }}
          # remember-me 쿠키가 있으면 로그인을 건너뜁니다(계정 잠금 방지).
          WELLSTORY_REMEMBER_ME: ${{ secrets.WELLSTORY_REMEMBER_ME }}
          WELLSTORY_CAMPUS: 전기부산
          WELLSTORY_RESTAURANT_CODE: REST000595
          BOBSSAFY_URL: https://bobssafy.streamlit.app/
          BOBSSAFY_ENABLED: "true"
          BOBSSAFY_TIMEOUT_MS: "45000"
          TIMEZONE: Asia/Seoul
        run: python -m lunchbot
