name: Daily lunch menu

on:
  schedule:
    - cron: "0 2 * * 1-5" # 평일 11:00 KST (UTC 02:00)
  workflow_dispatch:

jobs:
  send-lunch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv requests tzdata

      - name: Send today's menu
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          MATTERMOST_CHANNEL: ${{ secrets.MATTERMOST_CHANNEL || '간식먹고노라라' }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID || '9ac0b84f5d7b6f81293023d1245cd537' }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL || 'https://meeting.ssafy.com' }}
          MATTERMOST_TOKEN: ${{ secrets.MATTERMOST_TOKEN }}
          WELLSTORY_CAMPUS: ${{ secrets.WELLSTORY_CAMPUS || '전기부산' }}
          WELLSTORY_RESTAURANT_CODE: ${{ secrets.WELLSTORY_RESTAURANT_CODE || 'REST000595' }}
          TIMEZONE: Asia/Seoul
        run: python -m lunchbot
